[package]
name = "bench-tool"
description = "The pinned external tools of lowendaff-bench test items"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bench-api.workspace = true
rustix = { version = "1", features = ["process"] }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }

# Places a tool on given CPUs; Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "thread"] }

[dev-dependencies]
bench-host.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
