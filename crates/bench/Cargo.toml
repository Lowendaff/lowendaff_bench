[package]
name = "bench"
description = "lowendaff-bench orchestrator"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "lowendaff-bench"
path = "src/main.rs"

[dependencies]
bench-api.workspace = true
bench-host.workspace = true
plugin-cpu.workspace = true
plugin-disk.workspace = true
plugin-disk-health.workspace = true
plugin-geekbench.workspace = true
plugin-memory.workspace = true
plugin-system.workspace = true
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks", "stream"] }
rustix = { version = "1", features = ["process", "termios"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
toml = "1"
unicode-width = "0.2"
webpki-roots = "1"

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
serde.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }

[lints]
workspace = true
