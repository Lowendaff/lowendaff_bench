[package]
name = "swap-file"
description = "A temporary Linux swap file for lowendaff-bench: its header in safe Rust, swapon and swapoff"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["param"] }

[dev-dependencies]
tempfile.workspace = true

# The workspace's lints, except that unsafe code is denied rather than forbidden: the two
# functions that call swapon and swapoff allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
must_use_candidate = "warn"
needless_for_each = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
wildcard_imports = "warn"
