[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
bench-host = { path = "crates/bench-host" }
plugin-cpu = { path = "plugins/cpu" }
plugin-disk = { path = "plugins/disk" }
plugin-ip = { path = "plugins/ip" }
plugin-memory = { path = "plugins/memory" }
plugin-network = { path = "plugins/network" }
bench-api = { path = "crates/bench-api" }
bench-tool = { path = "crates/bench-tool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
smbios-lib = "0.9.4"
swap-file = { path = "crates/swap-file" }
tempfile = "3"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

# Google Rust style guide and strict project rules that clippy can check (CONTRIBUTING "Code").
[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
fallible_impl_from = "warn"
flat_map_option = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
must_use_candidate = "warn"
mutex_atomic = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
rc_buffer = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[profile.release]
# The orchestrator contains plugin panics only when panics unwind.
panic = "unwind"
