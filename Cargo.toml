[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
bench-host = { path = "crates/bench-host" }
plugin-disk = { path = "plugins/disk" }
plugin-disk-health = { path = "plugins/disk-health" }
plugin-system = { path = "plugins/system" }
bench-api = { path = "crates/bench-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
smbios-lib = "0.9.4"
swap-file = { path = "crates/swap-file" }
tempfile = "3"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

# Google Rust style guide rules that clippy can check (README "Code style").
[workspace.lints.clippy]
must_use_candidate = "warn"
needless_for_each = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"

[profile.release]
# The orchestrator contains plugin panics only when panics unwind (design §6).
panic = "unwind"
