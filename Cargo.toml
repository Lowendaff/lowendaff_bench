[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bench-api = { path = "crates/bench-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
# The orchestrator contains plugin panics only when panics unwind (design §6).
panic = "unwind"
