# Dependency policy, checked by `cargo deny check` (README "Gates").

[advisories]
# Any RustSec advisory for a crate in the graph fails the gate. To accept one, add its id to
# `ignore` together with the reason.
yanked = "deny"
ignore = []

[licenses]
# The project is MIT; every dependency must offer a permissive license compatible with it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla's root certificate data
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

# The workspace's crates depend in one direction: bench-host <- bench-api <- bench-tool <- the
# plugin crates <- bench. Each entry below bans a crate except as a dependency of the crates it
# names, so a dependency against the direction, or from one plugin crate on another, fails this
# check; a new dependency along the direction is added to its entry. bench-host may be used by
# every crate, and swap-file is a leaf of the CPU items. comfy-table draws the report's tables
# and belongs to bench alone: the other crates return data and leave the formatting to it.
deny = [
    { crate = "bench-api", reason = "the plugin contract, below bench-host only", wrappers = [
        "bench",
        "bench-tool",
        "plugin-cpu",
        "plugin-disk",
        "plugin-disk-health",
        "plugin-geekbench",
        "plugin-memory",
    ] },
    { crate = "bench-tool", reason = "the pinned tools, for the plugin crates", wrappers = [
        "plugin-cpu",
        "plugin-disk",
        "plugin-disk-health",
        "plugin-geekbench",
        "plugin-memory",
    ] },
    { crate = "plugin-cpu", reason = "plugin crates are used by bench alone", wrappers = [
        "bench",
    ] },
    { crate = "plugin-disk", reason = "plugin crates are used by bench alone", wrappers = [
        "bench",
    ] },
    { crate = "plugin-disk-health", reason = "plugin crates are used by bench alone", wrappers = [
        "bench",
    ] },
    { crate = "plugin-geekbench", reason = "plugin crates are used by bench alone", wrappers = [
        "bench",
    ] },
    { crate = "plugin-memory", reason = "plugin crates are used by bench alone", wrappers = [
        "bench",
    ] },
    { crate = "comfy-table", reason = "only the reporter in bench formats", wrappers = [
        "bench",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
