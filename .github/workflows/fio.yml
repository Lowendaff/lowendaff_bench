# Builds fio for the 硬盘性能 test item and publishes it as an immutable release (design
# disk, §4). A pull request that changes the build runs the build jobs only. A manual run on main
# also publishes the release named by TAG; afterwards the plugin's pins take its hashes and sizes.
# Immutable releases must be enabled in the repository settings before the first manual run.
name: fio

on:
  pull_request:
    paths:
      - scripts/build-fio.sh
      - .github/workflows/fio.yml
  workflow_dispatch:

permissions: {}

env:
  # One release per build of one fio version: a rebuild takes the next number, because an
  # immutable release's tag cannot be reused.
  TAG: fio-3.43-1

jobs:
  build:
    name: build fio (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pulls the Alpine image from ghcr.io/lowendaff/mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The Alpine 3.22 image of scripts/distros.txt, from its copy on GHCR (same digest).
      - name: Build
        env:
          IMAGE: ghcr.io/lowendaff/mirror/docker/library/alpine:3.22
          DIGEST: sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034
        run: |
          mkdir "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD/scripts/build-fio.sh:/build-fio.sh:ro" \
            -v "$RUNNER_TEMP/out:/out" "$IMAGE@$DIGEST" sh /build-fio.sh /out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fio-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads its assets
    steps:
      # Both builds carry the same script, source tarballs and license texts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/assets"
          version=${TAG#fio-}
          version=${version%-*}
          chmod +x fio-x86_64
          [ "$(./fio-x86_64 --version)" = "fio-$version" ]
          sha256sum fio-x86_64 fio-aarch64 build-fio.sh COPYING-* ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          {
            echo "Static fio $version for the 硬盘性能 test item, built by $run_url with"
            echo "build-fio.sh from the source tarballs attached here: fio (GPL-2.0) and libaio"
            echo "(LGPL-2.1, linked statically). Verify the files with \`sha256sum -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          # A draft first, so that every asset is in place before the release becomes immutable.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --target "$GITHUB_SHA" --title "fio $version, build ${TAG##*-}" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" -- \
            fio-x86_64 fio-aarch64 build-fio.sh COPYING-* ./*.tar.gz SHA256SUMS
          # Publishing makes a release the latest unless told otherwise, whatever the draft said.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
