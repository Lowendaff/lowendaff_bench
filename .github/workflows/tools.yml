# Builds the pinned tools and publishes them as immutable releases (design cpu, §4; P-10). A pull
# request that changes a build runs every build without publishing. A manual run on main builds
# the chosen tool and publishes the release that the RELEASE line of its script names; afterwards
# the plugins' pins take its hashes and sizes. An immutable release's tag cannot be reused, so a
# rebuild of the same version takes the next build number.
name: tools

on:
  pull_request:
    paths:
      - scripts/build-*.sh
      - .github/workflows/tools.yml
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to build and publish
        type: choice
        options: [fio, smartctl, sysbench]

permissions: {}

jobs:
  build:
    name: build ${{ matrix.tool }} (${{ matrix.arch }})
    strategy:
      matrix:
        # Every tool for a pull request, the chosen one for a manual run.
        tool: >-
          ${{ fromJSON(inputs.tool && format('["{0}"]', inputs.tool)
          || '["fio", "smartctl", "sysbench"]') }}
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pulls the Alpine image from ghcr.io/lowendaff/mirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The Alpine 3.22 image of scripts/distros.txt, from its copy on GHCR (same digest).
      - name: Build
        env:
          TOOL: ${{ matrix.tool }}
          IMAGE: ghcr.io/lowendaff/mirror/docker/library/alpine:3.22
          DIGEST: sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034
        run: |
          mkdir "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD/scripts/build-$TOOL.sh:/build-$TOOL.sh:ro" \
            -v "$RUNNER_TEMP/out:/out" "$IMAGE@$DIGEST" sh "/build-$TOOL.sh" /out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.tool }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # creates the release and uploads its assets
    steps:
      # Both builds carry the same script, source tarballs and license texts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool }}
        run: |
          cd "$RUNNER_TEMP/assets"
          tag=$(sed -n 's/^RELEASE=//p' "build-$TOOL.sh")
          [[ $tag =~ ^$TOOL-[0-9][0-9.]*-[0-9]+$ ]]
          version=${tag#"$TOOL"-}
          version=${version%-*}
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          {
            echo "Static $TOOL $version, built by $run_url with build-$TOOL.sh from the source"
            echo "tarballs attached here, whose license texts are in the COPYING-* and COPYRIGHT-*"
            echo "files. musl is linked statically; its notice is in COPYRIGHT-musl. Verify the"
            echo "files with \`sha256sum -c SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
          # A draft first, so that every asset is in place before the release becomes immutable.
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --target "$GITHUB_SHA" --title "$TOOL $version, build ${tag##*-}" \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" -- *
          # Publishing makes a release the latest unless told otherwise, whatever the draft said.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
