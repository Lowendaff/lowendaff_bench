# Temporary (never merged): compares this repository's fio build with YABS's on the runners.
name: compare fio builds

on:
  pull_request:

permissions: {}

jobs:
  compare:
    name: compare (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/compare-fio.sh
