# Dependabot proposes dependency updates as PRs. Commit messages follow the Angular convention
# without a scope (`build: bump ...`, `ci: bump ...`): CONTRIBUTING "Commits" reserves scopes for
# crate names. A 7-day cooldown keeps releases that are only days old out of the first proposal.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Temporary: proposes updates against the scratch branch dependabot-probe, whose Cargo.lock pins
  # webpki-roots 1.0.10, so that a pull request's CI shows whether a run that Dependabot triggers
  # pulls the private copies of the distribution images (README "Gates", Distributions). Removed
  # once that is known.
  - package-ecosystem: cargo
    directory: /
    target-branch: dependabot-probe
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
