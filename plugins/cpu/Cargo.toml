[package]
name = "plugin-cpu"
description = "Unified CPU benchmark plugin (cpu.bench) and sub-suites for lowendaff-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bench-api.workspace = true
bench-host.workspace = true
bench-tool.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde.workspace = true
swap-file.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "time"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
